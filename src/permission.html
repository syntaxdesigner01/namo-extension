<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Permission</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
            font-size: 12px;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        p {
            margin: 0 0 10px 0;
            color: #555;
        }

        ul {
            text-align: left;
            padding-left: 20px;
            margin: 0 0 15px 0;
            color: #555;
        }

        li {
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #grant-btn {
            background-color: #4CAF50;
            color: white;
        }

        #grant-btn:hover {
            background-color: #45a049;
        }

        #deny-btn {
            background-color: #f44336;
            color: white;
        }

        #deny-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>

<body>
    <h3>Allow Microphone Access</h3>
    <p>Oppa needs access to your microphone to listen for the wake word.</p>
    <ul>
        <li>Audio is processed locally.</li>
        <li>No voice data is sent to the cloud.</li>
        <li>Privacy is our priority.</li>
    </ul>
    <div class="buttons">
        <button id="grant-btn">Grant</button>
        <button id="deny-btn">Deny</button>
    </div>
    <script type="module" src="./permission.ts"></script>
</body>

</html>
